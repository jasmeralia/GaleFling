version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: America/Los_Angeles
  open-pull-requests-limit: 5
  ignore:
  # PyQt6 6.12.0 stubs are unparseable by mypy; see requirements.txt.
  - dependency-name: PyQt6
    versions:
    - '>=6.12.0'
  - dependency-name: PyQt6-WebEngine
    versions:
    - '>=6.12.0'
  groups:
    python-dependencies:
      patterns:
      - '*'
  reviewers:
  - jasmeralia
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: America/Los_Angeles
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
      - '*'
  reviewers:
  - jasmeralia
- package-ecosystem: devcontainers
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: America/Los_Angeles
  open-pull-requests-limit: 5
  groups:
    devcontainers:
      patterns:
      - '*'
  reviewers:
  - jasmeralia
